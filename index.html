<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5c9a">
<meta name="description" content="Echina — картуудаа нэг дор хадгал">
<title>Echina</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main class="scroll" id="main">

    <section class="panel profile" aria-label="Профайл">
      <button class="identity" type="button" id="profileBtn" aria-label="Профайл засах">
        <span class="avatar" aria-hidden="true">
          <img class="avatar-img" id="avatarImg" alt="" hidden>
          <span class="initials" id="initials">БТ</span>
          <span class="verified">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
          </span>
        </span>
        <span class="who">
          <span class="name" id="profileName">Б.Тэмүүлэн</span>
          <span class="email" id="profileEmail">temuulen@echina.mn</span>
        </span>
        <svg class="chev" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="divider"></div>
      <div class="savings">
        <p>Та энэ сард <b>3</b> үйлчилгээ авч <b>2 цаг</b> хэмнэлээ.</p>
        <button class="round-btn" id="expandBtn" type="button" aria-expanded="false" aria-controls="stats" aria-label="Дэлгэрэнгүй">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l5 5 5-5"/><path d="M7 12l5 5 5-5"/></svg>
        </button>
      </div>
      <div class="stats" id="stats" hidden>
        <div><span class="v" id="statCount">0</span><span class="l">Нийт карт</span></div>
        <div><span class="v" id="statSize">0 MB</span><span class="l">Эзэлсэн зай</span></div>
        <div><span class="v" id="statLast">—</span><span class="l">Сүүлд нэмсэн</span></div>
      </div>
    </section>

    <div class="sec-head">
      <h2>Миний бичиг баримтууд</h2>
      <button class="pill" id="refreshBtn" type="button">Шинэчлэх</button>
    </div>

    <div class="carousel" id="carousel" aria-label="Миний бичиг баримтууд"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>

    <div class="center"><button class="ghost-btn" id="allBtn" type="button">Бүх бичиг баримтыг харах</button></div>

    <section class="panel menu" aria-label="Бүртгэл">
      <button type="button" class="row" id="myInfoRow"><span class="tile t-user"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.6 4-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg></span><span class="label">Миний мэдээлэл</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M16 15h1.5"/></svg></span><span class="label">Цахим хэтэвч</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </section>

    <section class="panel menu" aria-label="Түүх">
      <button type="button" class="row" data-soon><span class="tile t-history"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V9H8"/><path d="M12 8v4.5l3 1.8"/></svg></span><span class="label">Үйлчилгээний түүх</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </section>

    <section class="panel menu" aria-label="Бусад">
      <button type="button" class="row" data-soon><span class="tile t-bell"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg></span><span class="label">Мэдэгдэл</span><span class="badge">4</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-heart"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></span><span class="label">Талархал</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-survey"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 12.5l2 2 4-4.5"/></svg></span><span class="label">Санал асуулга</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-message"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9.5L4 20z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg></span><span class="label">Өргөдөл, гомдол</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17h.01"/></svg></span><span class="label">Тусламж</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" class="row" data-soon><span class="tile t-shield"><svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.8-3.2 7.9-7.5 9-4.3-1.1-7.5-4.2-7.5-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg></span><span class="label">Баталгаажуулалт</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </section>

    <section class="panel menu" aria-label="Гарах">
      <button type="button" class="row" data-soon><span class="tile t-logout"><svg viewBox="0 0 24 24"><path d="M10 4H5.5v16H10"/><path d="M14.5 8l4 4-4 4"/><path d="M18.5 12H9"/></svg></span><span class="label">Системээс гарах</span></button>
    </section>
  </main>

  <nav class="nav" aria-label="Үндсэн цэс">
    <button type="button" class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span>Нүүр</span></button>
    <button type="button" class="tab" data-tab="services"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/></svg><span>Үйлчилгээ</span></button>
    <div class="fab-slot"><button type="button" class="fab" id="fab" aria-label="Карт нэмэх"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 20h2M20 14v2"/></svg></button></div>
    <button type="button" class="tab" data-tab="more"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Нэмэлт</span></button>
    <button type="button" class="tab active" data-tab="profile" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.5-2 3.4-3 5.5-3s4 1 5.5 3"/></svg><span>Профайл</span></button>
  </nav>
</div>

<!-- Add card -->
<dialog class="sheet" id="addDialog" aria-labelledby="addTitle">
  <form method="dialog" id="addForm">
    <div class="grab" aria-hidden="true"></div>
    <h3 id="addTitle">Карт нэмэх</h3>
    <div class="sides">
      <div class="side">
        <span class="side-label">Урд тал</span>
        <label class="slot" id="slotFront">
          <input type="file" accept="image/*" id="fileFront" aria-label="Урд талын зураг сонгох">
          <img alt="Урд тал" hidden>
          <span class="slot-empty"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Зураг нэмэх</span>
        </label>
      </div>
      <div class="side">
        <span class="side-label">Ард тал</span>
        <label class="slot" id="slotBack">
          <input type="file" accept="image/*" id="fileBack" aria-label="Ард талын зураг сонгох">
          <img alt="Ард тал" hidden>
          <span class="slot-empty"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Зураг нэмэх</span>
        </label>
        <button type="button" class="link-btn small" id="removeBack" hidden>Ард талыг арилгах</button>
      </div>
    </div>
    <label class="field">
      <span>Нэр (заавал биш)</span>
      <input type="text" id="cardName" maxlength="40" placeholder="Жишээ: Фитнесийн карт" autocomplete="off">
    </label>
    <p class="note">Зураг зөвхөн таны төхөөрөмж дээр хадгалагдана, сервер рүү илгээгдэхгүй.</p>
    <div class="actions">
      <button type="button" class="btn secondary" id="cancelAdd">Болих</button>
      <button type="button" class="btn primary" id="saveAdd" disabled>Хадгалах</button>
    </div>
    <button type="button" class="link-btn danger-text" id="deleteFromSheet" hidden>Энэ картыг устгах</button>
  </form>
</dialog>

<!-- Edit profile -->
<dialog class="sheet" id="profileDialog" aria-labelledby="profileTitle">
  <div class="grab" aria-hidden="true"></div>
  <h3 id="profileTitle">Профайл засах</h3>
  <div class="pf-avatar">
    <span class="avatar big" aria-hidden="true">
      <img class="avatar-img" id="pfAvatarImg" alt="" hidden>
      <span class="initials" id="pfInitials">БТ</span>
    </span>
    <div class="pf-avatar-actions">
      <label class="pick small">
        <input type="file" accept="image/*" id="pfAvatarFile">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Зураг солих
      </label>
      <button type="button" class="link-btn" id="pfAvatarRemove">Зураг устгах</button>
    </div>
  </div>
  <label class="field">
    <span>Нэр</span>
    <input type="text" id="pfName" maxlength="40" autocomplete="name" required>
  </label>
  <label class="field">
    <span>Имэйл</span>
    <input type="email" id="pfEmail" maxlength="80" autocomplete="email" inputmode="email" placeholder="name@gmail.com">
  </label>
  <p class="field-error" id="pfError" role="alert" hidden></p>
  <div class="actions">
    <button type="button" class="btn secondary" id="pfCancel">Болих</button>
    <button type="button" class="btn primary" id="pfSave">Хадгалах</button>
  </div>
</dialog>

<!-- View card -->
<dialog class="viewer" id="viewDialog" aria-labelledby="viewTitle">
  <div class="viewer-top">
    <h3 id="viewTitle">Карт</h3>
    <button type="button" class="icon-btn" id="closeView" aria-label="Хаах"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="viewer-img">
    <figure><img id="viewFront" alt="Урд тал"><figcaption>Урд тал</figcaption></figure>
    <figure id="viewBackWrap"><img id="viewBack" alt="Ард тал"><figcaption>Ард тал</figcaption></figure>
  </div>
  <div class="viewer-actions">
    <button type="button" class="btn secondary" id="editCard">Засах</button>
    <button type="button" class="btn danger" id="deleteCard">Устгах</button>
  </div>
</dialog>

<!-- All cards -->
<dialog class="sheet tall" id="allDialog" aria-labelledby="allTitle">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h3 id="allTitle">Бүх карт</h3>
    <button type="button" class="icon-btn" id="closeAll" aria-label="Хаах"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="grid" id="grid"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
